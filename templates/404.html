{% extends "base.html" %}

{% block title %}404 Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-info">404</h1>
        <h3 class="fw-bold mb-3">Page Not Found</h3>
        <p class="text-muted mb-4">The requested page or resource could not be found on the server.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary fw-bold px-4 py-2">
            <i class="bi bi-house-door me-2"></i> Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
