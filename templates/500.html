{% extends "base.html" %}

{% block title %}500 Internal Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-danger">500</h1>
        <h3 class="fw-bold mb-3">Internal Server Error</h3>
        <p class="text-muted mb-4">An unexpected error occurred while processing your request.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary fw-bold px-4 py-2">
            <i class="bi bi-house-door me-2"></i> Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
